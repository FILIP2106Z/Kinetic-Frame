name: Build & Release KineticFrame

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Assemble APKs
        run: |
          gradle assembleDebug --no-daemon
          gradle assembleRelease --no-daemon || echo "Release keystore not provided; debug APK ready for distribution."

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kineticframe-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
